server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets are immutable
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker and entry must always revalidate. Without this on index.html the
    # browser caches it heuristically, so after a redeploy it keeps serving the old
    # HTML — which points at asset hashes that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /registerSW.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # nginx:alpine has no webmanifest entry in mime.types, so the manifest went out as
    # application/octet-stream and Firefox refused it. Do NOT fix this with a `types`
    # block: that replaces the whole inherited map and makes every response
    # application/octet-stream. Override the type only where the manifest is served.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
